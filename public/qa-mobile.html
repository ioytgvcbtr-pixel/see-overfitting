<!doctype html>
<html lang="zh-CN">
  <meta charset="utf-8" /><title>FitLab · 移动端布局核验</title
  ><style>
    body {
      margin: 0;
      background: #e9edf4;
      font-family: Arial, "Microsoft YaHei", sans-serif;
      color: #6e7c99;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      gap: 65px;
    }
    aside {
      width: 290px;
    }
    h1 {
      font-size: 28px;
      font-weight: 500;
      color: #465779;
      line-height: 1.6;
    }
    p {
      font-size: 13px;
      line-height: 2;
    }
    small {
      font-size: 10px;
      letter-spacing: 2px;
      color: #98a4bb;
    }
    iframe {
      width: 390px;
      height: 844px;
      border: 8px solid #343e57;
      border-radius: 26px;
      box-shadow: 0 18px 60px #35466c20;
      background: white;
    }
    @media (max-width: 800px) {
      aside {
        display: none;
      }
      iframe {
        height: 780px;
      }
    }
  </style>
  <aside>
    <small>FITLAB · RESPONSIVE QA</small>
    <h1>把实验室<br />放进口袋。</h1>
    <p>390px 独立浏览上下文<br />检查窄屏布局、导航与主要操作。</p>
  </aside>
  <iframe src="/" title="390px移动端实验工作台"></iframe>
  <script>
    const requestedView = new URLSearchParams(location.search).get("view");
    if (
      [
        "concepts",
        "classification",
        "studio",
        "datasets",
        "history",
        "path",
      ].includes(requestedView)
    ) {
      document.querySelector("iframe").src = "/#" + requestedView;
    }
    const requestedWidth = Number(
      new URLSearchParams(location.search).get("width"),
    );
    if (
      Number.isFinite(requestedWidth) &&
      requestedWidth >= 320 &&
      requestedWidth <= 1440
    ) {
      const frame = document.querySelector("iframe");
      frame.style.width = `${Math.round(requestedWidth)}px`;
      frame.title = `${Math.round(requestedWidth)}px布局核验`;
      if (requestedWidth >= 600)
        document.querySelector("aside").style.display = "none";
    }
  </script>
</html>
